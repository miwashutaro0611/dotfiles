# starship.toml — see https://starship.rs/config/ for full reference

# プロンプトの間に空行を入れて読みやすく
add_newline = true

# プロンプト表示順
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$python\
$rust\
$ruby\
$package\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold cyan"
read_only         = " "

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
style          = "bold yellow"
ahead          = "⇡${count}"
behind         = "⇣${count}"
diverged       = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted     = "= "
untracked      = "?"
modified       = "!"
staged         = "+"
renamed        = "»"
deleted        = "✘"
stashed        = "≡"

[cmd_duration]
min_time            = 2_000
format              = "took [$duration]($style) "
style               = "yellow"
show_milliseconds   = false

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"

[bun]
symbol = "🥟 "
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = " "

[ruby]
symbol = " "

[package]
disabled = true

[time]
disabled = true
